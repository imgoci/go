# mockery: mock generation for the ports (AGENTS.md T2/T3).
#
# Every mock in this repository is generated; none is hand-written. A port is
# declared by the package that consumes it — internal/transfer for the
# registry and multipart ports — and its mock lives under the adapter that
# implements it, in a `mocks` subpackage, so a test importing
# internal/registry/mocks or internal/multipart/mocks gets the doubles
# (T3: mocks under the implementing adapter).
#
# Regenerate with `mise x -- mockery` (or `moon run root:mocks`) after changing
# a port, and commit the result.

# Only the interfaces listed below are mocked; nothing is generated wholesale.
all: false

# The testify template emits testify/mock-based doubles, matching the
# assertion library the tests already use.
template: testify

# Generated files are real source, not test-only files: they are imported
# across package boundaries by the tests of other packages.
formatter: goimports
force-file-write: true
pkgname: mocks
structname: '{{.Mock}}{{.InterfaceName}}'

packages:
  github.com/imgoci/go/internal/transfer:
    interfaces:
      # Registry ports: implemented by internal/registry, the net/http
      # distribution client.
      Blobs:
        config:
          dir: internal/registry/mocks
          filename: blobs.go
      Manifests:
        config:
          dir: internal/registry/mocks
          filename: manifests.go
      # Multipart port: implemented by internal/multipart, the public
      # bigoci.Client adapter.
      Multipart:
        config:
          dir: internal/multipart/mocks
          filename: multipart.go
