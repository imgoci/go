site_name: imgoci/go
site_description: Go library implementing the imgoci release format
site_url: https://imgoci.github.io/go/
repo_name: imgoci/go
repo_url: https://github.com/imgoci/go
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorial:
      - Publish and fetch your first release: tutorials/first-release.md
  - How-to guides:
      - Resolve deliverables: how-to/resolve-deliverables.md
      - Verify a release: how-to/verify-a-release.md
      - Use Docker credentials: how-to/use-docker-credentials.md
  - Reference:
      - Go API: reference/api.md
      - Errors: reference/errors.md
      - CLI: reference/cli.md
      - Capabilities: reference/capabilities.md
  - Explanation:
      - Architecture: explanation/architecture.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css
